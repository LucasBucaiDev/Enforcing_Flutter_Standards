name: Skills quality

on:
  push:
    paths:
      - ".agents/skills/**"
      - "skill-evals/**"
      - "tool/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/skills-quality.yml"
  pull_request:
    paths:
      - ".agents/skills/**"
      - "skill-evals/**"
      - "tool/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/skills-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.12.2

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .agents/skills skill-evals tool

      - name: Validate skill structure and links
        run: dart run tool/validate_skills.dart

      - name: Validate context budgets
        run: dart run skill-evals/evidence-driven-development/context_budget_test.dart

      - name: Validate source catalog
        run: dart run skill-evals/enforcing-flutter-standards/source_catalog_test.dart

      - name: Test Flutter project inspector
        run: dart run skill-evals/enforcing-flutter-standards/inspect_flutter_project_test.dart

      - name: Test skills quality gates
        run: dart run skill-evals/skills-quality/skills_quality_test.dart

      - name: Check whitespace errors
        run: git diff --check
